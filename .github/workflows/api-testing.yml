name: API Testing CI/CD

on:
  push:
    branches: [main, api-testing]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual run

jobs:
  api-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      # Step 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2. Create .env file from template and secrets
      - name: Create Laravel .env file 🔧
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Creating Laravel .env file..."
          envsubst < sprint5-with-bugs/API/.env.ci > sprint5-with-bugs/API/.env
          echo ".env file created successfully."

      # Step 3. Start Docker services
      - name: Start Docker containers
        run: docker compose up -d

      # Step 4. Wait for Laravel API to be ready
      - name: Wait for Services
        run: sleep 60
        shell: bash

      # Step 5. Run database migrations + seed
      - name: Setup Application
        run: |
          echo "Installing Composer dependencies..."
          docker compose run --rm composer

          echo "Fixing permissions..."
          docker compose exec -T -u root laravel-api chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

          echo "Running database migrations and seeding..."
          docker compose exec -T laravel-api php artisan migrate:fresh --seed --force

      # Step 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Step 7. Install Postman CLI
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      # Step 8. Login Postman CLI (API Key from secrets)
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      # Step 9a. Run REGISTER collection
      - name: Run REGISTER API Tests
        run: |
          postman collection run "${{ secrets.POSTMAN_COLLECTION_REGISTER }}" \
            -e "${{ secrets.POSTMAN_ENV_ID }}" \
            -d sprint5-with-bugs/API/tests/API/data_registration.csv \
            --reporters cli,junit,html \
            --reporter-junit-export register-results.xml \
            --reporter-html-export register-results.html || true

      # Step 9b. Run LOGIN collection
      - name: Run LOGIN API Tests
        run: |
          postman collection run "${{ secrets.POSTMAN_COLLECTION_LOGIN }}" \
            -e "${{ secrets.POSTMAN_ENV_ID }}" \
            -d sprint5-with-bugs/API/tests/API/data_login.csv \
            --reporters cli,junit,html \
            --reporter-junit-export login-results.xml \
            --reporter-html-export login-results.html || true

      # Step 9c. Run ME collection
      - name: Run ME API Tests
        run: |
          postman collection run "${{ secrets.POSTMAN_COLLECTION_ME }}" \
            -e "${{ secrets.POSTMAN_ENV_ID }}" \
            -d sprint5-with-bugs/API/tests/API/data_profile.csv \
            --reporters cli,junit,html \
            --reporter-junit-export me-results.xml \
            --reporter-html-export me-results.html || true

      # Step 10. Upload Test Reports as artifacts
      - name: Upload Test Reports 📊
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-reports
          path: |
            *.xml
            *.html

      # Step 11. Generate GitHub-friendly test summary
      - name: Verdict on test report 📊
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "*.xml"
          fail_on_failure: true

      # Step 12. Cleanup containers & volumes
      - name: Cleanup
        if: always()
        run: docker compose down -v
